<!DOCTYPE html>
<html>
<head>
    <title>SHB Door Controller</title>

    <style>
        :root {
            --primary: #6366f1;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #eab308;
            --background: #0f172a;
            --surface: #1e293b;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            padding: 40px;
            background: var(--background);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 4.5rem;
            margin: 0;
        }

        #status {
            font-size: 2.2rem;
            margin: 2rem 0;
            min-height: 3rem;
            text-align: center;
        }

        .button-group {
            display: flex;
            gap: 3rem;
            margin: 2rem 0;
        }

        .control-btn {
            padding: 3rem 6rem;
            font-size: 3rem;
            border: none;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 6px 10px -1px rgba(0, 0, 0, 0.1);
        }

        .control-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -3px rgba(0, 0, 0, 0.3);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        #scanBtn {
            background: var(--primary);
            font-size: 2.8rem;
            padding: 2.5rem 5rem;
        }

        #openBtn {
            background: var(--success);
            padding: 3rem 6rem;
        }

        #halfBtn {
            background: var(--warning);
            padding: 3rem 6rem;
        }

        #closeBtn {
            background: var(--primary);
            padding: 3rem 6rem;
        }

        #stopBtn {
            background: var(--danger);
            padding: 8rem 8rem;
            font-size: 8rem;
        }

        .controls {
            display: grid;
            gap: 2.5rem;
            margin-top: 2rem;
            width: 100%;
            max-width: 1200px;
        }

        .connected-door {
            font-size: 3.5rem;
            text-align: center;
            color: #94a3b8;
            margin: 2rem 0;
        }

        #scanScreen,
        #controlScreen {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /*
         * IMPORTANT:
         * The scan screen is the default screen.
         */
        #scanScreen {
            display: flex;
        }

        #controlScreen {
            display: none;
        }

        .back-btn {
            margin-top: 3rem;
            padding: 2rem 5rem;
            font-size: 2.2rem;
            background: var(--danger);
        }

        .scan-message {
            font-size: 2rem;
            color: #94a3b8;
            text-align: center;
            margin-top: 1rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--surface);
            padding: 2rem;
            border-radius: 1rem;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 6px 10px -1px rgba(0, 0, 0, 0.3);
        }

        .modal-content input {
            padding: 1rem;
            font-size: 1.8rem;
            margin: 1rem 0;
            width: 80%;
            border: 2px solid var(--primary);
            border-radius: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-align: center;
        }

        .modal-content button {
            padding: 1rem 2rem;
            font-size: 1.6rem;
            margin: 0.5rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            background: var(--primary);
            color: white;
        }

        .modal-content button.cancel {
            background: var(--danger);
        }

        @media (max-width: 768px) {
            .control-btn {
                padding: 2rem 3rem;
                font-size: 2.2rem;
            }

            #stopBtn {
                padding: 3rem 6rem;
                font-size: 2.8rem;
            }

            .header h1 {
                font-size: 3.5rem;
            }

            #status {
                font-size: 1.8rem;
            }

            .connected-door {
                font-size: 2.5rem;
            }

            .scan-message {
                font-size: 1.5rem;
            }
        }
    </style>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <!-- ========================================================= -->
    <!-- SCREEN 1: SCANNING / CONNECTION                          -->
    <!-- ========================================================= -->

    <div id="scanScreen">

        <div class="header">
            <h1>SHB Door Control v1.9</h1>

            <div class="connected-door" id="doorStatusScan">
                Not connected
            </div>

            <div class="scan-message" id="scanMessage">
                READY TO SCAN FOR DOORS
            </div>
        </div>

        <div class="button-group">

            <button
                class="control-btn"
                id="scanBtn"
                onclick="scanDoors()"
            >
                SCAN DOORS
            </button>

        </div>

    </div>


    <!-- ========================================================= -->
    <!-- SCREEN 2: DOOR OPERATIONS                                 -->
    <!-- ========================================================= -->

    <div id="controlScreen">

        <div class="header">

            <h1>
                SHB Door Control — OPERATIONS
            </h1>

            <div
                class="connected-door"
                id="doorStatusControl"
            >
                Connected to: —
            </div>

        </div>


        <div class="controls">

            <button
                class="control-btn"
                id="openBtn"
                onclick="sendCommand('O\n')"
            >
                OPEN
            </button>


            <button
                class="control-btn"
                id="halfBtn"
                onclick="sendCommand('H\n')"
            >
                HALF
            </button>


            <button
                class="control-btn"
                id="closeBtn"
                onclick="sendCommand('C\n')"
            >
                CLOSE
            </button>


            <button
                class="control-btn"
                id="stopBtn"
                onclick="sendCommand('S\n')"
            >
                STOP
            </button>

        </div>


        <button
            class="control-btn back-btn"
            onclick="disconnect()"
        >
            CHANGE DOOR / DISCONNECT
        </button>

    </div>


    <!-- ========================================================= -->
    <!-- STATUS                                                     -->
    <!-- ========================================================= -->

    <div id="status"></div>


    <!-- ========================================================= -->
    <!-- PASSCODE MODAL                                             -->
    <!-- ========================================================= -->

    <div
        class="modal"
        id="passcodeModal"
    >

        <div class="modal-content">

            <h2 id="modalTitle">
                Enter Passcode
            </h2>

            <input
                type="password"
                id="passcodeInput"
                maxlength="4"
                placeholder="Enter 4-digit code"
            >

            <div>

                <button onclick="verifyPasscode()">
                    Submit
                </button>

                <button
                    class="cancel"
                    onclick="closePasscodeModal()"
                >
                    Cancel
                </button>

            </div>

        </div>

    </div>


    <!-- ========================================================= -->
    <!-- JAVASCRIPT                                                 -->
    <!-- ========================================================= -->

    <script>

        // =========================================================
        // BLUETOOTH SETTINGS
        // =========================================================

        const UART_SERVICE_UUID =
            '0000ffe0-0000-1000-8000-00805f9b34fb';

        const UART_CHARACTERISTIC_UUID =
            '0000ffe1-0000-1000-8000-00805f9b34fb';


        // =========================================================
        // CONNECTION VARIABLES
        // =========================================================

        let currentDevice = null;

        let currentCharacteristic = null;

        let connectedDoor = null;

        let selectedDevice = null;


        // =========================================================
        // DOOR PASSCODES
        // =========================================================

        const DOOR_PASSCODES = {

            'D1': null,

            'D2': '1234',

            'D3': '4045',

            'D4': null,

            'D5': '9999'

        };


        const DEFAULT_PASSCODE = null;


        // =========================================================
        // SHOW SCAN SCREEN
        // =========================================================

        function showScanScreen() {

            document.getElementById('scanScreen').style.display = 'flex';

            document.getElementById('controlScreen').style.display = 'none';

            document.getElementById('scanMessage').textContent =
                'READY TO SCAN FOR DOORS';

            updateUI();

            /*
             * Put the keyboard focus on SCAN DOORS.
             * This makes the page ready for the operator
             * immediately after opening it.
             */

            setTimeout(() => {

                const scanButton =
                    document.getElementById('scanBtn');

                if (scanButton) {
                    scanButton.focus();
                }

            }, 100);

        }


        // =========================================================
        // SHOW CONTROL SCREEN
        // =========================================================

        function showControlScreen() {

            document.getElementById('scanScreen').style.display =
                'none';

            document.getElementById('controlScreen').style.display =
                'flex';

        }


        // =========================================================
        // PASSCODE MODAL
        // =========================================================

        function showPasscodeModal(device) {

            selectedDevice = device;

            const doorName =
                device.name || 'Unknown';

            document.getElementById('modalTitle').textContent =
                `Enter Passcode for ${doorName}`;

            document.getElementById('passcodeModal').style.display =
                'flex';

            document.getElementById('passcodeInput').value = '';

            document.getElementById('passcodeInput').focus();

        }


        function closePasscodeModal() {

            document.getElementById('passcodeModal').style.display =
                'none';

            selectedDevice = null;

            showStatus(
                'Passcode entry cancelled',
                true
            );

        }


        // =========================================================
        // VERIFY PASSCODE
        // =========================================================

        function verifyPasscode() {

            const input =
                document.getElementById('passcodeInput').value;

            const doorName =
                selectedDevice?.name || 'Unknown';

            const correctPasscode =
                DOOR_PASSCODES[doorName] !== undefined
                    ? DOOR_PASSCODES[doorName]
                    : DEFAULT_PASSCODE;


            if (
                correctPasscode === null ||
                input === correctPasscode
            ) {

                document.getElementById(
                    'passcodeModal'
                ).style.display = 'none';

                connectToDoor(selectedDevice);

            }
            else {

                showStatus(
                    'Incorrect passcode',
                    true
                );

                document.getElementById(
                    'passcodeInput'
                ).value = '';

            }

        }


        // =========================================================
        // ALLOW ENTER KEY FOR PASSCODE
        // =========================================================

        document
            .getElementById('passcodeInput')
            .addEventListener('keydown', function(event) {

                if (event.key === 'Enter') {

                    verifyPasscode();

                }

                if (event.key === 'Escape') {

                    closePasscodeModal();

                }

            });


        // =========================================================
        // SCAN FOR DOORS
        // =========================================================

        async function scanDoors() {

            /*
             * Web Bluetooth requires a user gesture.
             *
             * The page automatically opens to this scan screen,
             * but the actual Bluetooth chooser must be started
             * by pressing SCAN DOORS.
             */

            if (!navigator.bluetooth) {

                showStatus(
                    'Web Bluetooth is not supported by this browser.',
                    true
                );

                return;

            }


            try {

                showStatus(
                    'Scanning for doors...'
                );

                document.getElementById(
                    'scanMessage'
                ).textContent =
                    'SELECT A DOOR FROM THE BLUETOOTH LIST';


                const device =
                    await navigator.bluetooth.requestDevice({

                        filters: [
                            {
                                namePrefix: 'D'
                            }
                        ],

                        optionalServices: [
                            UART_SERVICE_UUID
                        ]

                    });


                // =================================================
                // MAKE SURE IT IS A VALID DOOR
                // =================================================

                if (
                    !/^D([1-9]|[1-9][0-9])$/.test(
                        device.name
                    )
                ) {

                    showStatus(
                        'Only D1-D99 doors supported',
                        true
                    );

                    document.getElementById(
                        'scanMessage'
                    ).textContent =
                        'READY TO SCAN FOR DOORS';

                    return;

                }


                // =================================================
                // CHECK PASSCODE
                // =================================================

                const passcode =
                    DOOR_PASSCODES[device.name] !== undefined
                        ? DOOR_PASSCODES[device.name]
                        : DEFAULT_PASSCODE;


                if (passcode === null) {

                    await connectToDoor(device);

                }
                else {

                    showPasscodeModal(device);

                }

            }
            catch (err) {

                console.error(
                    'Bluetooth scan error:',
                    err
                );


                if (err.name === 'NotFoundError') {

                    showStatus(
                        'No Bluetooth door selected',
                        true
                    );

                }
                else if (err.name === 'NotAllowedError') {

                    showStatus(
                        'Bluetooth access was cancelled or blocked.',
                        true
                    );

                }
                else {

                    showStatus(
                        `Error: ${err.message}`,
                        true
                    );

                }


                document.getElementById(
                    'scanMessage'
                ).textContent =
                    'READY TO SCAN FOR DOORS';

            }

        }


        // =========================================================
        // CONNECT TO DOOR
        // =========================================================

        async function connectToDoor(device) {

            try {

                showStatus(
                    `Connecting to ${device.name}...`
                );


                // =================================================
                // DISCONNECT OLD DEVICE
                // =================================================

                if (
                    currentDevice &&
                    currentDevice.gatt &&
                    currentDevice.gatt.connected
                ) {

                    await currentDevice.gatt.disconnect();

                }


                // =================================================
                // SAVE DEVICE
                // =================================================

                currentDevice = device;


                // =================================================
                // CONNECT TO GATT
                // =================================================

                const server =
                    await currentDevice.gatt.connect();


                // =================================================
                // GET UART SERVICE
                // =================================================

                const service =
                    await server.getPrimaryService(
                        UART_SERVICE_UUID
                    );


                // =================================================
                // GET CHARACTERISTIC
                // =================================================

                currentCharacteristic =
                    await service.getCharacteristic(
                        UART_CHARACTERISTIC_UUID
                    );


                // =================================================
                // SAVE DOOR NAME
                // =================================================

                connectedDoor =
                    device.name;


                // =================================================
                // UPDATE DISPLAY
                // =================================================

                updateUI();


                showStatus(
                    `Connected to ${connectedDoor}`
                );


                // =================================================
                // SHOW OPERATIONS SCREEN
                // =================================================

                showControlScreen();


                // =================================================
                // WATCH FOR DISCONNECT
                // =================================================

                currentDevice.addEventListener(
                    'gattserverdisconnected',
                    handleDisconnected
                );

            }
            catch (err) {

                console.error(
                    'Connection failed:',
                    err
                );

                showStatus(
                    `Connection failed: ${err.message}`,
                    true
                );

                connectedDoor = null;

                currentCharacteristic = null;

                updateUI();

                showScanScreen();

            }

        }


        // =========================================================
        // HANDLE BLUETOOTH DISCONNECT
        // =========================================================

        function handleDisconnected() {

            connectedDoor = null;

            currentCharacteristic = null;

            updateUI();

            showStatus(
                'Door disconnected',
                true
            );

            /*
             * Automatically return to the scanning screen
             * whenever the door connection is lost.
             */

            showScanScreen();

        }


        // =========================================================
        // DISCONNECT / CHANGE DOOR
        // =========================================================

        async function disconnect() {

            try {

                if (
                    currentDevice &&
                    currentDevice.gatt &&
                    currentDevice.gatt.connected
                ) {

                    await currentDevice.gatt.disconnect();

                }

            }
            catch (err) {

                console.error(
                    'Disconnect error:',
                    err
                );

            }


            currentCharacteristic = null;

            currentDevice = null;

            connectedDoor = null;

            selectedDevice = null;


            document.getElementById(
                'passcodeModal'
            ).style.display = 'none';


            updateUI();


            showStatus(
                'Ready to scan for another door'
            );


            showScanScreen();

        }


        // =========================================================
        // SEND DOOR COMMAND
        // =========================================================

        async function sendCommand(command) {

            if (!currentCharacteristic) {

                showStatus(
                    'Not connected to any door',
                    true
                );

                return;

            }


            try {

                const data =
                    new TextEncoder().encode(command);


                await currentCharacteristic.writeValue(
                    data
                );


                showStatus(
                    `Sent: ${command.trim()} command`
                );

            }
            catch (err) {

                console.error(
                    'Command failed:',
                    err
                );

                showStatus(
                    `Send failed: ${err.message}`,
                    true
                );

            }

        }


        // =========================================================
        // UPDATE UI
        // =========================================================

        function updateUI() {

            const statusText =
                connectedDoor
                    ? `Connected to: ${connectedDoor}`
                    : 'Not connected';


            document.getElementById(
                'doorStatusScan'
            ).textContent = statusText;


            document.getElementById(
                'doorStatusControl'
            ).textContent = statusText;

        }


        // =========================================================
        // STATUS MESSAGE
        // =========================================================

        function showStatus(
            message,
            isError = false
        ) {

            const statusDiv =
                document.getElementById('status');


            statusDiv.textContent =
                message;


            statusDiv.style.color =
                isError
                    ? '#ef4444'
                    : '#22c55e';

        }


        // =========================================================
        // STARTUP
        // =========================================================
        //
        // IMPORTANT:
        //
        // Every time the HTML page is opened/reloaded:
        //
        // 1. Any old screen state is cleared.
        // 2. The connection variables are reset.
        // 3. The SCAN DOORS screen is displayed.
        // 4. The SCAN DOORS button receives focus.
        //
        // The Bluetooth chooser itself cannot be automatically
        // opened by Chrome/Edge without a user interaction.
        //
        // =========================================================

        window.addEventListener(
            'load',
            function() {

                // Reset connection state

                currentDevice = null;

                currentCharacteristic = null;

                connectedDoor = null;

                selectedDevice = null;


                // Make absolutely sure the passcode window
                // is closed when the page opens.

                document.getElementById(
                    'passcodeModal'
                ).style.display = 'none';


                // Always start at the scan screen.

                document.getElementById(
                    'scanScreen'
                ).style.display = 'flex';


                document.getElementById(
                    'controlScreen'
                ).style.display = 'none';


                // Reset scan message.

                document.getElementById(
                    'scanMessage'
                ).textContent =
                    'READY TO SCAN FOR DOORS';


                // Reset status.

                showStatus(
                    'Ready to scan for doors'
                );


                // Update door information.

                updateUI();


                // Put focus on SCAN DOORS.

                setTimeout(
                    function() {

                        const scanButton =
                            document.getElementById(
                                'scanBtn'
                            );

                        if (scanButton) {

                            scanButton.focus();

                        }

                    },
                    150
                );

            }
        );


    </script>

</body>
</html>
