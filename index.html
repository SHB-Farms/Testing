<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>SHB Fleet Manager Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --primary: #1a5e2a;
            --primary-light: #2e7d4a;
            --primary-dark: #0c3b1a;
            --secondary: #d48c2c;
            --surface: #ffffff;
            --background: #f2f6f2;
            --text: #1e2a24;
            --text-light: #5a6b60;
            --border: #dce4dc;
            --shadow: 0 10px 30px -10px rgba(0,20,10,0.12);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.25s cubic-bezier(0.2, 0, 0, 1);
        }
        [data-theme="dark"] {
            --primary: #3b8b4a;
            --primary-light: #5ca86b;
            --primary-dark: #1e4f2a;
            --secondary: #dba45a;
            --surface: #1e2621;
            --background: #111811;
            --text: #e8ede8;
            --text-light: #a0b3a5;
            --border: #2f3d33;
            --shadow: 0 10px 30px -10px rgba(0,0,0,0.6);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--background);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            transition: background var(--transition), color var(--transition);
        }
        .app-wrapper {
            display: flex;
            height: 100vh;
            max-width: 1600px;
            margin: 0 auto;
            background: var(--surface);
            box-shadow: var(--shadow);
            border-radius: 0;
            overflow: hidden;
            position: relative;
        }
        /* ----- SIDEBAR ----- */
        .sidebar {
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: var(--transition);
            overflow-y: auto;
            padding-bottom: 12px;
        }
        .sidebar-header {
            padding: 24px 20px 16px;
            background: var(--primary);
            color: white;
            border-radius: 0 0 28px 28px;
            margin-bottom: 8px;
        }
        .sidebar-header h1 {
            font-size: 1.6rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.3px;
        }
        .sidebar-header h1 small {
            font-size: 0.8rem;
            font-weight: 400;
            opacity: 0.8;
            margin-left: 6px;
        }
        .search-box {
            position: relative;
            margin: 0 16px 16px;
        }
        .search-box input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 1px solid var(--border);
            border-radius: 40px;
            font-size: 0.95rem;
            background: var(--background);
            color: var(--text);
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }
        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(26,94,42,0.12);
        }
        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 1.2rem;
        }
        .category-scroll {
            padding: 0 12px 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            margin: 0 12px 12px;
        }
        .chip {
            padding: 8px 16px;
            border-radius: 40px;
            background: var(--background);
            border: 1px solid transparent;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
        }
        .chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(26,94,42,0.25);
        }
        .chip .badge {
            background: rgba(0,0,0,0.08);
            border-radius: 20px;
            padding: 0 8px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .chip.active .badge { background: rgba(255,255,255,0.2); color: white; }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 12px 16px 0;
        }
        .stat-card {
            background: var(--background);
            border-radius: var(--radius-sm);
            padding: 14px 10px;
            text-align: center;
            transition: var(--transition);
        }
        .stat-card .num {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.2;
        }
        .stat-card .label {
            font-size: 0.75rem;
            color: var(--text-light);
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        /* ----- MAIN LIST ----- */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--background);
        }
        .toolbar {
            padding: 16px 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .toolbar h2 {
            font-size: 1.3rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toolbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .sort-select {
            padding: 8px 14px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: var(--surface);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            color: var(--text);
        }
        .btn {
            padding: 10px 20px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: var(--transition);
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 8px rgba(26,94,42,0.15);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            box-shadow: none;
        }
        .btn-outline:hover { background: var(--background); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 8px 18px rgba(26,94,42,0.25); }
        .btn-danger { background: #c62828; color: white; }
        .btn-danger:hover { background: #b71c1c; }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .equipment-grid {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .equipment-card {
            background: var(--surface);
            border-radius: var(--radius-sm);
            padding: 16px 18px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .equipment-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow);
            border-color: var(--primary-light);
        }
        .equipment-card.selected {
            border-color: var(--primary);
            background: rgba(26,94,42,0.04);
            box-shadow: 0 0 0 2px var(--primary);
        }
        .thumb {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background: var(--background);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: var(--primary);
            flex-shrink: 0;
            overflow: hidden;
        }
        .thumb img { width: 100%; height: 100%; object-fit: cover; }
        .card-body {
            flex: 1;
            min-width: 0;
        }
        .card-body .title {
            font-weight: 600;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .card-body .meta {
            display: flex;
            gap: 16px;
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 10px;
            margin-right: 4px;
        }
        .badge-overdue {
            background: #c62828;
            color: white;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            margin-left: 6px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        .empty-state i { font-size: 3.5rem; color: var(--border); margin-bottom: 16px; }
        /* ----- DETAIL PANEL ----- */
        .detail-panel {
            width: 0;
            background: var(--surface);
            border-left: 1px solid var(--border);
            overflow: hidden;
            transition: width 0.3s ease, padding 0.3s ease;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .detail-panel.open {
            width: 420px;
            padding: 0;
        }
        .panel-header {
            padding: 20px 24px;
            background: var(--primary);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 0 0 24px 24px;
        }
        .panel-header h3 {
            font-weight: 600;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-close {
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 40px;
            font-size: 1.4rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .panel-close:hover { background: rgba(255,255,255,0.25); }
        .panel-body {
            padding: 20px 24px;
            overflow-y: auto;
            flex: 1;
        }
        .detail-row {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }
        .detail-row .label {
            width: 110px;
            font-weight: 500;
            color: var(--text-light);
            font-size: 0.85rem;
        }
        .detail-row .value {
            flex: 1;
            font-weight: 500;
        }
        .maintenance-list {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .maintenance-item {
            background: var(--background);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            border-left: 4px solid var(--primary-light);
        }
        .maintenance-item .head {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .maintenance-item .details { font-size: 0.9rem; color: var(--text-light); }
        .panel-actions {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            background: var(--background);
        }
        /* ----- MODALS ----- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            max-width: 520px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.96);
            transition: transform 0.25s ease;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }
        .modal-overlay.show .modal { transform: scale(1); }
        .modal-header {
            padding: 18px 24px;
            background: var(--primary);
            color: white;
            border-radius: var(--radius) var(--radius) 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h2 { font-weight: 600; font-size: 1.25rem; display: flex; align-items: center; gap: 10px; }
        .modal-body { padding: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 500; font-size: 0.9rem; margin-bottom: 6px; color: var(--text-light); }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            background: var(--background);
            color: var(--text);
            transition: var(--transition);
        }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(26,94,42,0.08); }
        .form-row { display: flex; gap: 14px; }
        .form-row .form-group { flex: 1; }
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .pin-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 12px;
        }
        .pin-btn {
            padding: 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--background);
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text);
        }
        .pin-btn:active { transform: scale(0.94); background: var(--primary); color: white; }
        .pin-input {
            font-size: 1.6rem;
            letter-spacing: 12px;
            text-align: center;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            width: 100%;
            background: var(--background);
            color: var(--text);
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 500;
            z-index: 3000;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .sync-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--primary-dark);
            color: white;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 1500;
        }
        .sync-bar.active { transform: translateY(0); }
        .sync-bar .progress {
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            flex: 1;
            margin: 0 16px;
            overflow: hidden;
        }
        .sync-bar .progress .fill {
            height: 100%;
            width: 0%;
            background: white;
            transition: width 0.3s;
        }
        .saving-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .saving-overlay.active { opacity: 1; pointer-events: auto; }
        .saving-box {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .saving-box .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .top-bar {
            position: absolute;
            top: 16px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 40px;
            background: var(--surface);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .icon-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .icon-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        @media (max-width: 900px) {
            .sidebar { width: 240px; }
            .detail-panel.open { width: 340px; }
        }
        @media (max-width: 720px) {
            .app-wrapper { flex-direction: column; height: auto; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); max-height: 280px; }
            .main-area { height: 70vh; }
            .detail-panel.open { width: 100%; position: fixed; inset: 0; z-index: 500; border-left: none; }
            .toolbar { padding: 12px 16px; }
            .equipment-grid { padding: 12px; }
            .top-bar { top: 8px; right: 12px; gap: 6px; }
            .icon-btn { width: 36px; height: 36px; }
        }
        @media (max-width: 480px) {
            .form-row { flex-direction: column; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .sidebar-header h1 { font-size: 1.2rem; }
            .toolbar h2 { font-size: 1rem; }
        }
    </style>
</head>
<body>
<div class="app-wrapper">
    <!-- Top right actions -->
    <div class="top-bar">
        <button class="icon-btn" id="themeToggle" title="Toggle theme"><i class="mdi mdi-theme-light-dark"></i></button>
        <button class="icon-btn" id="adminToggle" title="Admin mode"><i class="mdi mdi-shield-account"></i></button>
        <button class="icon-btn" id="syncNowBtn" title="Sync now"><i class="mdi mdi-cloud-sync"></i></button>
        <button class="icon-btn" id="tokenIndicator" title="GitHub token"><i class="mdi mdi-key-variant"></i></button>
    </div>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>SHB Fleet <small>Pro</small></h1>
        </div>
        <div class="search-box">
            <i class="mdi mdi-magnify"></i>
            <input type="text" id="equipmentSearch" placeholder="Search by name, ID, notes...">
        </div>
        <div class="category-scroll" id="categoryFilters">
            <button class="chip active" data-category="all">All <span class="badge" id="count-all">0</span></button>
            <button class="chip" data-category="tractor"><i class="mdi mdi-tractor"></i> Tractors <span class="badge" id="count-tractor">0</span></button>
            <button class="chip" data-category="truck"><i class="mdi mdi-truck"></i> Trucks <span class="badge" id="count-truck">0</span></button>
            <button class="chip" data-category="trailer"><i class="mdi mdi-trailer"></i> Trailers <span class="badge" id="count-trailer">0</span></button>
            <button class="chip" data-category="implement"><i class="mdi mdi-tools"></i> Implements <span class="badge" id="count-implement">0</span></button>
            <button class="chip" data-category="car"><i class="mdi mdi-car"></i> Cars <span class="badge" id="count-car">0</span></button>
            <button class="chip" data-category="other"><i class="mdi mdi-cog"></i> Other <span class="badge" id="count-other">0</span></button>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><div class="num" id="totalEquipment">0</div><div class="label">Total</div></div>
            <div class="stat-card"><div class="num" id="overdueEquipment">0</div><div class="label">Overdue</div></div>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="main-area">
        <div class="toolbar">
            <h2><i class="mdi mdi-view-list"></i> Inventory</h2>
            <div class="toolbar-actions">
                <select class="sort-select" id="sortSelect">
                    <option value="name-asc">Name A–Z</option>
                    <option value="name-desc">Name Z–A</option>
                    <option value="year-asc">Year (oldest)</option>
                    <option value="year-desc">Year (newest)</option>
                    <option value="nextService">Next service</option>
                </select>
                <button class="btn btn-primary" id="addEquipmentBtn"><i class="mdi mdi-plus"></i> Add</button>
            </div>
        </div>
        <div class="equipment-grid" id="equipmentGrid">
            <!-- dynamic cards -->
        </div>
    </main>

    <!-- DETAIL PANEL -->
    <aside class="detail-panel" id="detailPanel">
        <div class="panel-header">
            <h3><i class="mdi mdi-information-outline"></i> Details</h3>
            <button class="panel-close" id="closePanel"><i class="mdi mdi-close"></i></button>
        </div>
        <div class="panel-body" id="detailBody">
            <div id="detailContent"></div>
        </div>
        <div class="panel-actions">
            <button class="btn btn-outline" id="editEquipmentBtn"><i class="mdi mdi-pencil"></i> Edit</button>
            <button class="btn btn-primary" id="addMaintenanceBtn"><i class="mdi mdi-wrench"></i> Service</button>
            <button class="btn btn-danger" id="deleteEquipmentBtn"><i class="mdi mdi-delete"></i></button>
        </div>
    </aside>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="tokenModal"><div class="modal">
    <div class="modal-header"><h2><i class="mdi mdi-github"></i> GitHub Token</h2><button class="panel-close" id="closeTokenModal"><i class="mdi mdi-close"></i></button></div>
    <div class="modal-body"><p class="text-light" style="margin-bottom:16px;">Enter your GitHub Personal Access Token (repo scope).</p><input type="password" class="form-control" id="tokenInput" placeholder="ghp_..."></div>

        <div class="form-row"><div class="form-group"><label>Last Service</label><input type="date" class="form-control" id="lastService"></div><div class="form-group"><label>Next Service</label><input type="date" class="form-control" id="nextService"></div></div>
    </div>
    <div class="modal-footer"><button class="btn btn-outline" id="cancelEquipmentBtn">Cancel</button><button class="btn btn-primary" id="saveEquipmentBtn">Save</button></div>

<div class="modal-overlay" id="maintenanceModal"><div class="modal">
    <div class="modal-header"><h2 id="maintenanceModalTitle"><i class="mdi mdi-wrench"></i> Service Record</h2><button class="panel-close" id="closeMaintenanceModal"><i class="mdi mdi-close"></i></button></div>
    <div class="modal-body">
        <div class="form-row"><div class="form-group"><label>Date</label><input type="date" class="form-control" id="maintenanceDate"></div><div class="form-group"><label>Type</label><input type="text" class="form-control" id="maintenanceType" placeholder="Oil change, brake..."></div></div>
        <div class="form-row"><div class="form-group"><label>Mileage</label><input type="number" class="form-control" id="maintenanceMileage" placeholder="miles"></div><div class="form-group"><label>Hours</label><input type="number" class="form-control" id="maintenanceHours" placeholder="hours" step="0.1"></div></div>
        <div class="form-group"><label>Technician</label><input type="text" class="form-control" id="maintenanceTech" placeholder="Name"></div>
        <div class="form-group"><label>Details</label><textarea class="form-control" id="maintenanceDetails" rows="2" placeholder="Work performed..."></textarea></div>
        <div class="form-group" id="nextServiceGroup"><label>Next Service Date</label><input type="date" class="form-control" id="nextServiceDate"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-outline" id="cancelMaintenanceBtn">Cancel</button><button class="btn btn-primary" id="saveMaintenanceBtn">Save</button></div>
</div></div>

    <div class="modal-header"><h2><i class="mdi mdi-delete-alert"></i> Confirm Delete</h2><button class="panel-close" id="closeDeleteModal"><i class="mdi mdi-close"></i></button></div>
    <div class="modal-body"><p>Delete <strong id="deleteEquipmentName"></strong>? This cannot be undone.</p></div>
    <div class="modal-footer"><button class="btn btn-outline" id="cancelDeleteBtn">Cancel</button><button class="btn btn-danger" id="confirmDeleteBtn">Delete</button></div>
</div></div>

<!-- SYNC BAR -->
<div class="sync-bar" id="syncStatusBar"><span id="syncMessage">Syncing...</span><div class="progress"><div class="fill" id="progressBar"></div></div><button class="btn btn-outline" style="background:transparent;border-color:rgba(255,255,255,0.3);color:white;padding:4px 12px;" id="cancelSyncBtn">Cancel</button></div>
<div class="saving-overlay" id="savingIndicator"><div class="saving-box"><div class="spinner"></div><h3>Saving changes...</h3><p style="color:var(--text-light);margin-top:8px;">Please wait</p><div style="height:4px;background:var(--border);border-radius:4px;margin-top:20px;overflow:hidden;"><div style="height:100%;width:0%;background:var(--primary);transition:width 0.3s;" id="savingProgressBar"></div></div></div></div>

<script>
    // ----- CONFIG -----
    const GITHUB_USER = "shb-farms";
    const GITHUB_REPO = "Farm-Log";
    const DATA_PATH = "farmdata.json";
    const ADMIN_PIN = "1234";

    let equipmentData = [];
    let fileSHA = null;
    let GITHUB_PAT = localStorage.getItem('github_pat') || '';
    let selectedEquipment = null;
    let adminMode = false;
    let syncInProgress = false;
    let syncIntervalId = null;

    // DOM refs
    const $ = id => document.getElementById(id);
    const grid = $('equipmentGrid');
    const detailPanel = $('detailPanel');
    const detailContent = $('detailContent');
    const searchInput = $('equipmentSearch');
    const categoryChips = document.querySelectorAll('.chip');
    const sortSelect = $('sortSelect');
    const addBtn = $('addEquipmentBtn');
    const editBtn = $('editEquipmentBtn');
    const deleteBtn = $('deleteEquipmentBtn');
    const addMaintBtn = $('addMaintenanceBtn');
    const closePanel = $('closePanel');
    const tokenIndicator = $('tokenIndicator');
    const syncNowBtn = $('syncNowBtn');
    const syncStatusBar = $('syncStatusBar');
    const syncMessage = $('syncMessage');
    const progressBar = $('progressBar');
    const savingIndicator = $('savingIndicator');
    const savingProgressBar = $('savingProgressBar');

    // ----- HELPERS -----
    function formatDate(d) { if(!d) return '—'; return new Date(d).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' }); }
    function statusText(s) { return { active:'Active', inactive:'Inactive', maintenance:'In Maintenance' }[s] || s; }
    function statusColor(s) { return { active:'#2e7d32', inactive:'#c62828', maintenance:'#d48c2c' }[s] || '#888'; }
    function isOverdue(equip) { if(!equip.nextMaintenance) return false; return new Date(equip.nextMaintenance) < new Date(); }
    function toast(msg, icon='mdi-check-circle') {
        const t = document.createElement('div'); t.className='toast'; t.innerHTML=`<i class="mdi ${icon}"></i> ${msg}`;
        document.body.appendChild(t); setTimeout(()=>t.remove(), 3000);
    }
    function showSaving() { savingIndicator.classList.add('active'); savingProgressBar.style.width='0%'; }
    function hideSaving() { savingIndicator.classList.remove('active'); }

    // ----- GITHUB -----
    function utf8ToBase64(str) { return btoa(new TextEncoder().encode(str).reduce((s,b)=>s+String.fromCharCode(b),'')); }
    function base64ToUtf8(b64) { return new TextDecoder().decode(Uint8Array.from(atob(b64), c=>c.charCodeAt(0))); }

    async function fetchRemote() {
        if(!GITHUB_PAT) throw new Error('No token');
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${DATA_PATH}`, { headers: { Authorization: `Bearer ${GITHUB_PAT}` } });
        if(!res.ok) throw new Error(await res.text());
        const info = await res.json();
        return { equipment: JSON.parse(base64ToUtf8(info.content)).equipment || [], sha: info.sha };
    }

    async function pushData() {
        if(!GITHUB_PAT) throw new Error('No token');
        const content = JSON.stringify({ equipment: equipmentData, timestamp: Date.now() }, null, 2);
        const body = { message: 'Update equipment data', content: utf8ToBase64(content), branch: 'main' };
        if(fileSHA) body.sha = fileSHA;
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${DATA_PATH}`, {
            method: 'PUT', headers: { Authorization: `Bearer ${GITHUB_PAT}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        if(!res.ok) {
            if(res.status === 409) { const remote = await fetchRemote(); fileSHA = remote.sha; return pushData(); }
            throw new Error(await res.text());
        }
        const data = await res.json();
        fileSHA = data.content.sha;
        return true;
    }

    async function saveChanges() {
        showSaving();
        try { await pushData(); toast('Saved successfully'); } catch(e) { toast('Save failed: '+e.message, 'mdi-alert'); console.error(e); }
        hideSaving();
        renderAll();
    }

    async function syncData() {
        if(syncInProgress || !GITHUB_PAT) return;
        syncInProgress = true;
        syncStatusBar.classList.add('active');
        syncMessage.textContent = 'Syncing...';
        progressBar.style.width = '30%';
        try {
            const remote = await fetchRemote();
            progressBar.style.width = '70%';
            // simple merge: remote wins for conflicts, but keep local history
            const merged = mergeData(equipmentData, remote.equipment);
            equipmentData = merged;
            fileSHA = remote.sha;
            progressBar.style.width = '100%';
            toast('Sync complete');
        } catch(e) {
            toast('Sync error: '+e.message, 'mdi-alert');
            console.error(e);
        }
        syncInProgress = false;
        setTimeout(()=>syncStatusBar.classList.remove('active'), 1500);
        renderAll();
    }

    function mergeData(local, remote) {
        const map = new Map(remote.map(i=>[i.id, i]));
        const result = [];
        for(const item of local) {
            if(map.has(item.id)) {
                const r = map.get(item.id);
                // preserve local history if newer? simple: remote wins for fields, but keep history union
                const merged = { ...r, maintenanceHistory: mergeHistory(item.maintenanceHistory||[], r.maintenanceHistory||[]) };
                result.push(merged);
                map.delete(item.id);
            } else result.push(item);
        }
        for(const item of remote) if(map.has(item.id)) result.push(item);
        return result;
    }
    function mergeHistory(a,b) {
        const map = new Map([...a, ...b].map(i=>[i.id, i]));
        return Array.from(map.values()).sort((x,y)=>new Date(y.date)-new Date(x.date));
    }

    // ----- RENDER -----
    function renderAll() {
        renderStats();
        renderGrid();
        if(selectedEquipment) openDetail(selectedEquipment);
    }

    function renderStats() {
        const total = equipmentData.length;
        const overdue = equipmentData.filter(isOverdue).length;
        $('totalEquipment').textContent = total;
        $('overdueEquipment').textContent = overdue;
        const counts = { all: total, tractor:0, truck:0, trailer:0, implement:0, car:0, other:0 };
        equipmentData.forEach(e => { if(counts.hasOwnProperty(e.category)) counts[e.category]++; });
        document.querySelectorAll('.chip').forEach(chip => {
            const cat = chip.dataset.category;
            const badge = chip.querySelector('.badge');
            if(badge) badge.textContent = counts[cat] || 0;
        });
    }

    function getFiltered() {
        const search = searchInput.value.trim().toLowerCase();
        const cat = document.querySelector('.chip.active')?.dataset?.category || 'all';
        let list = equipmentData;
        if(cat !== 'all') list = list.filter(e => e.category === cat);
        if(search) list = list.filter(e => (e.name+' '+e.id+' '+e.notes).toLowerCase().includes(search));
        const sort = sortSelect.value;
        list.sort((a,b) => {
            if(sort === 'name-asc') return a.name.localeCompare(b.name);
            if(sort === 'name-desc') return b.name.localeCompare(a.name);
            if(sort === 'year-asc') return (a.year||0) - (b.year||0);
            if(sort === 'year-desc') return (b.year||0) - (a.year||0);
            if(sort === 'nextService') {
                const da = a.nextMaintenance ? new Date(a.nextMaintenance) : new Date(0);
                const db = b.nextMaintenance ? new Date(b.nextMaintenance) : new Date(0);
                return da - db;
            }
            return 0;
        });
        return list;
    }

    function renderGrid() {
        const list = getFiltered();
        if(!list.length) {
            grid.innerHTML = `<div class="empty-state"><i class="mdi mdi-tractor"></i><h3>No equipment found</h3><p style="color:var(--text-light);">Add your first machine or adjust filters.</p></div>`;
            return;
        }
        grid.innerHTML = '';
        list.forEach(equip => {
            const card = document.createElement('div');
            card.className = 'equipment-card' + (selectedEquipment?.id === equip.id ? ' selected' : '');
            const icon = { tractor:'mdi-tractor', truck:'mdi-truck', trailer:'mdi-trailer', implement:'mdi-tools', car:'mdi-car', other:'mdi-cog' }[equip.category] || 'mdi-cog';
            card.innerHTML = `
                <div class="thumb">${equip.imageData ? `<img src="${equip.imageData}" alt="">` : `<i class="mdi ${icon}"></i>`}</div>
                <div class="card-body">
                    <div class="title">${equip.name} ${isOverdue(equip) ? '<span class="badge-overdue">OVERDUE</span>' : ''}</div>
                    <div class="meta">
                        <span><span class="status-dot" style="background:${statusColor(equip.status)}"></span>${statusText(equip.status)}</span>
                        <span>${equip.id}</span>
                        <span>${equip.year || '—'}</span>
                        <span>Next: ${formatDate(equip.nextMaintenance)}</span>
                    </div>
                </div>
            `;
            card.addEventListener('click', ()=> { selectEquipment(equip); });
            grid.appendChild(card);
        });
    }

    function selectEquipment(equip) {
        selectedEquipment = equip;
        document.querySelectorAll('.equipment-card').forEach(c => c.classList.toggle('selected', c._equipId === equip.id));
        openDetail(equip);
    }

    function openDetail(equip) {
        detailPanel.classList.add('open');
        const maint = equip.maintenanceHistory || [];
        detailContent.innerHTML = `
            <div class="detail-row"><span class="label">Name</span><span class="value">${equip.name}</span></div>
            <div class="detail-row"><span class="label">ID</span><span class="value">${equip.id}</span></div>
            <div class="detail-row"><span class="label">Category</span><span class="value">${equip.category}</span></div>
            <div class="detail-row"><span class="label">Year</span><span class="value">${equip.year || '—'}</span></div>
            <div class="detail-row"><span class="label">Status</span><span class="value"><span class="status-dot" style="background:${statusColor(equip.status)}"></span> ${statusText(equip.status)}</span></div>
            <div class="detail-row"><span class="label">Last Service</span><span class="value">${formatDate(equip.lastMaintenance)}</span></div>
            <div class="detail-row"><span class="label">Next Service</span><span class="value">${formatDate(equip.nextMaintenance)} ${isOverdue(equip) ? '<span style="color:#c62828;font-weight:600;">(Overdue)</span>' : ''}</span></div>
            ${equip.imageData ? `<div style="margin:12px 0;text-align:center;"><img src="${equip.imageData}" style="max-width:100%;max-height:200px;border-radius:12px;border:1px solid var(--border);"></div>` : ''}
            <div class="detail-row"><span class="label">Notes</span><span class="value">${equip.notes || '—'}</span></div>
            <h4 style="margin:20px 0 12px;font-weight:600;">Service History</h4>
            <div class="maintenance-list">
                ${maint.length ? maint.map(r => `
                    <div class="maintenance-item">
                        <div class="head"><span>${formatDate(r.date)}</span><span>${r.type}</span></div>
                        <div class="details">${r.details || ''} ${r.technician ? '· Tech: '+r.technician : ''} ${r.mileage ? '· '+r.mileage+' mi' : ''} ${r.hours ? '· '+r.hours+' hrs' : ''}</div>
                    </div>
                `).join('') : '<p style="color:var(--text-light);">No service records.</p>'}
            </div>
        `;
        // show/hide admin buttons
        editBtn.style.display = adminMode ? 'flex' : 'none';
        deleteBtn.style.display = adminMode ? 'flex' : 'none';
    }

    // ----- MODALS -----
    function showModal(id) { document.getElementById(id).classList.add('show'); }
    function hideModal(id) { document.getElementById(id).classList.remove('show'); }

    // Equipment form
    function openEquipmentForm(editData=null) {
        const title = editData ? 'Edit Equipment' : 'Add Equipment';
        $('equipmentModalTitle').innerHTML = `<i class="mdi ${editData ? 'mdi-pencil' : 'mdi-plus-circle'}"></i> ${title}`;
        if(editData) {
            $('equipName').value = editData.name || '';
            $('equipCategory').value = editData.category || 'tractor';
            $('equipId').value = editData.id || '';
            $('equipYear').value = editData.year || '';
            $('equipStatus').value = editData.status || 'active';
            $('equipNotes').value = editData.notes || '';
            $('lastService').value = editData.lastMaintenance || '';
            $('nextService').value = editData.nextMaintenance || '';
            if(editData.imageData) { $('previewImg').src = editData.imageData; $('imagePreview').style.display = 'block'; }
            else $('imagePreview').style.display = 'none';
        } else {
            $('equipName').value = ''; $('equipCategory').value='tractor'; $('equipId').value=''; $('equipYear').value='';
            $('equipStatus').value='active'; $('equipNotes').value=''; $('lastService').value=''; $('nextService').value='';
            $('imagePreview').style.display = 'none';
        }
        $('equipmentModal')._editId = editData?.id || null;
        showModal('equipmentModal');
    }

    $('saveEquipmentBtn').addEventListener('click', async ()=>{
        const name = $('equipName').value.trim();
        const id = $('equipId').value.trim();
        if(!name || !id) { toast('Name and ID required', 'mdi-alert'); return; }
        const editId = $('equipmentModal')._editId;
        const data = {
            id, name, category: $('equipCategory').value, year: $('equipYear').value,
            status: $('equipStatus').value, notes: $('equipNotes').value,
            lastMaintenance: $('lastService').value, nextMaintenance: $('nextService').value,
            imageData: $('previewImg').src && $('previewImg').src.startsWith('data:') ? $('previewImg').src : null,
            maintenanceHistory: []
        };
        if(editId) {
            const idx = equipmentData.findIndex(e => e.id === editId);
            if(idx>=0) {
                // keep history
                data.maintenanceHistory = equipmentData[idx].maintenanceHistory || [];
                equipmentData[idx] = { ...equipmentData[idx], ...data };
            }
        } else {
            if(equipmentData.some(e=>e.id===id)) { toast('ID already exists', 'mdi-alert'); return; }
            data.maintenanceHistory = [];
            equipmentData.push(data);
        }
        hideModal('equipmentModal');
        await saveChanges();
        renderAll();
        if(selectedEquipment) openDetail(selectedEquipment);
    });

    // Maintenance form
    function openMaintenanceForm(record=null) {
        const title = record ? 'Edit Service' : 'Add Service';
        $('maintenanceModalTitle').innerHTML = `<i class="mdi mdi-wrench"></i> ${title}`;
        $('maintenanceDate').value = record?.date || new Date().toISOString().split('T')[0];
        $('maintenanceType').value = record?.type || '';
        $('maintenanceMileage').value = record?.mileage || '';
        $('maintenanceHours').value = record?.hours || '';
        $('maintenanceTech').value = record?.technician || '';
        $('maintenanceDetails').value = record?.details || '';
        $('nextServiceDate').value = record?.nextService || '';
        $('maintenanceModal')._recordId = record?.id || null;
        showModal('maintenanceModal');
    }

    $('saveMaintenanceBtn').addEventListener('click', async ()=>{
        if(!selectedEquipment) return;
        const date = $('maintenanceDate').value;
        const type = $('maintenanceType').value.trim();
        if(!date || !type) { toast('Date and type required', 'mdi-alert'); return; }
        const record = {
            id: $('maintenanceModal')._recordId || 'MH-'+Date.now().toString().slice(-6),
            date, type,
            mileage: parseInt($('maintenanceMileage').value) || null,
            hours: parseFloat($('maintenanceHours').value) || null,
            technician: $('maintenanceTech').value.trim(),
            details: $('maintenanceDetails').value.trim(),
            nextService: $('nextServiceDate').value || null
        };
        const idx = equipmentData.findIndex(e => e.id === selectedEquipment.id);
        if(idx>=0) {
            const hist = equipmentData[idx].maintenanceHistory || [];
            const existing = hist.findIndex(r => r.id === record.id);
            if(existing>=0) hist[existing] = record;
            else hist.unshift(record);
            equipmentData[idx].maintenanceHistory = hist;
            equipmentData[idx].lastMaintenance = date;
            if(record.nextService) equipmentData[idx].nextMaintenance = record.nextService;
            else {
                // auto +1 year
                const d = new Date(date); d.setFullYear(d.getFullYear()+1);
                equipmentData[idx].nextMaintenance = d.toISOString().split('T')[0];
            }
        }
        hideModal('maintenanceModal');
        await saveChanges();
        renderAll();
        if(selectedEquipment) openDetail(selectedEquipment);
    });

    // Delete
    $('confirmDeleteBtn').addEventListener('click', async ()=>{
        if(!selectedEquipment) return;
        const idx = equipmentData.findIndex(e => e.id === selectedEquipment.id);
        if(idx>=0) equipmentData.splice(idx,1);
        hideModal('deleteModal');
        selectedEquipment = null;
        detailPanel.classList.remove('open');
        await saveChanges();
        renderAll();
        toast('Deleted');
    });

    // ----- PIN -----
    function buildPinPad() {
        const grid = document.getElementById('pinGrid');
        grid.innerHTML = '';
        ['1','2','3','4','5','6','7','8','9','back','0','enter'].forEach(v => {
            const btn = document.createElement('button');
            btn.className = 'pin-btn';
            if(v==='back') btn.innerHTML = '<i class="mdi mdi-backspace"></i>';
            else if(v==='enter') btn.innerHTML = '<i class="mdi mdi-check"></i>';
            else btn.textContent = v;
            btn.addEventListener('click', ()=>{
                const input = $('pinInput');
                if(v==='back') input.value = input.value.slice(0,-1);
                else if(v==='enter') {
                    if(input.value === ADMIN_PIN) {
                        adminMode = true;
                        document.querySelector('#adminToggle').classList.add('active');
                        addBtn.style.display = 'flex';
                        hideModal('pinModal');
                        toast('Admin mode activated');
                        renderAll();
                    } else { input.value = ''; toast('Wrong PIN', 'mdi-alert'); }
                } else if(input.value.length < 4) input.value += v;
            });
            grid.appendChild(btn);
        });
    }
    buildPinPad();

    // ----- EVENT BINDINGS -----
    // Admin toggle
    $('adminToggle').addEventListener('click', ()=>{
        if(adminMode) {
            adminMode = false;
            document.querySelector('#adminToggle').classList.remove('active');
            addBtn.style.display = 'none';
            toast('Admin mode deactivated');
            renderAll();
        } else {
            $('pinInput').value = '';
            showModal('pinModal');
        }
    });

    // Token
    $('tokenIndicator').addEventListener('click', ()=> { $('tokenInput').value = GITHUB_PAT; showModal('tokenModal'); });
    $('saveTokenBtn').addEventListener('click', ()=>{
        const t = $('tokenInput').value.trim();
        if(t) { GITHUB_PAT = t; localStorage.setItem('github_pat', t); toast('Token saved'); hideModal('tokenModal'); syncData(); }
    });
    $('clearTokenBtn').addEventListener('click', ()=>{ GITHUB_PAT = ''; localStorage.removeItem('github_pat'); toast('Token cleared'); hideModal('tokenModal'); });

    // Theme
    $('themeToggle').addEventListener('click', ()=>{
        const dark = document.documentElement.getAttribute('data-theme') === 'dark';
        document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
        localStorage.setItem('theme', dark ? 'light' : 'dark');
    });
    if(localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

    // Search & filters
    searchInput.addEventListener('input', renderAll);
    categoryChips.forEach(chip => chip.addEventListener('click', ()=>{
        categoryChips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        renderAll();
    }));
    sortSelect.addEventListener('change', renderAll);

    // Buttons
    addBtn.addEventListener('click', ()=>openEquipmentForm());
    closePanel.addEventListener('click', ()=>{ detailPanel.classList.remove('open'); selectedEquipment = null; });
    editBtn.addEventListener('click', ()=>{ if(selectedEquipment) openEquipmentForm(selectedEquipment); });
    addMaintBtn.addEventListener('click', ()=>{ if(selectedEquipment) openMaintenanceForm(); });
    deleteBtn.addEventListener('click', ()=>{
        if(selectedEquipment) {
            $('deleteEquipmentName').textContent = selectedEquipment.name;
            showModal('deleteModal');
        }
    });
    syncNowBtn.addEventListener('click', syncData);

    // Modal close buttons
    document.querySelectorAll('.modal .panel-close, .modal .btn-outline[data-dismiss]').forEach(el => {
        el.addEventListener('click', ()=> hideModal(el.closest('.modal-overlay')?.id));
    });
    // shortcut: close modal on overlay click
    document.querySelectorAll('.modal-overlay').forEach(overlay => overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.classList.remove('show'); }));

    // Image preview
    $('equipImage').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(file) {
            const reader = new FileReader();
            reader.onload = ev => { $('previewImg').src = ev.target.result; $('imagePreview').style.display = 'block'; };
            reader.readAsDataURL(file);
        }
    });
    $('removeImageBtn').addEventListener('click', ()=>{ $('previewImg').src=''; $('imagePreview').style.display='none'; $('equipImage').value=''; });

    // Auto-sync interval
    setInterval(() => { if(GITHUB_PAT) syncData(); }, 60000);

    // ----- INIT -----
    async function init() {
        if(GITHUB_PAT) {
            try {
                const remote = await fetchRemote();
                equipmentData = remote.equipment || [];
                fileSHA = remote.sha;
                toast('Data loaded');
            } catch(e) {
                console.warn('Init fetch failed', e);
                equipmentData = [];
            }
        } else {
            toast('Set GitHub token to sync', 'mdi-key');
        }
        renderAll();
        if(equipmentData.length) {
            // select first
            selectedEquipment = equipmentData[0];
            openDetail(selectedEquipment);
        }
        // show add button only in admin mode
        addBtn.style.display = 'none';
        editBtn.style.display = 'none';
        deleteBtn.style.display = 'none';
    }
    init();
</script>
</body>
</html>
