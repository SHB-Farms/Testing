<!DOCTYPE html>
<html>
<head>
    <title>SHB Door Controller</title>

    <style>
        :root {
            --primary: #6366f1;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #eab308;
            --background: #0f172a;
            --surface: #1e293b;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            padding: 40px;
            background: var(--background);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 4.5rem;
            margin: 0;
        }

        #status {
            font-size: 2.2rem;
            margin: 2rem 0;
            min-height: 3rem;
            text-align: center;
        }

        .button-group {
            display: flex;
            gap: 3rem;
            margin: 2rem 0;
        }

        .control-btn {
            padding: 3rem 6rem;
            font-size: 3rem;
            border: none;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 6px 10px -1px rgba(0, 0, 0, 0.1);
        }

        .control-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -3px rgba(0, 0, 0, 0.3);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        #scanBtn {
            background: var(--primary);
            font-size: 2.8rem;
            padding: 2.5rem 5rem;
        }

        #openBtn {
            background: var(--success);
            padding: 3rem 6rem;
        }

        #halfBtn {
            background: var(--warning);
            padding: 3rem 6rem;
        }

        #closeBtn {
            background: var(--primary);
            padding: 3rem 6rem;
        }

        #stopBtn {
            background: var(--danger);
            padding: 8rem 8rem;
            font-size: 8rem;
        }

        .controls {
            display: grid;
            gap: 2.5rem;
            margin-top: 2rem;
            width: 100%;
            max-width: 1200px;
        }

        .connected-door {
            font-size: 3.5rem;
            text-align: center;
            color: #94a3b8;
            margin: 2rem 0;
        }

        .scan-message {
            font-size: 2rem;
            color: #94a3b8;
            text-align: center;
            margin: 1rem 0;
        }

        #scanScreen,
        #controlScreen {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #controlScreen {
            display: none;
        }

        .back-btn {
            margin-top: 3rem;
            padding: 2rem 5rem;
            font-size: 2.2rem;
            background: var(--danger);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--surface);
            padding: 2rem;
            border-radius: 1rem;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 6px 10px -1px rgba(0, 0, 0, 0.3);
        }

        .modal-content input {
            padding: 1rem;
            font-size: 1.8rem;
            margin: 1rem 0;
            width: 80%;
            border: 2px solid var(--primary);
            border-radius: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-align: center;
        }

        .modal-content button {
            padding: 1rem 2rem;
            font-size: 1.6rem;
            margin: 0.5rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            background: var(--primary);
            color: white;
        }

        .modal-content button.cancel {
            background: var(--danger);
        }

        @media (max-width: 768px) {
            .control-btn {
                padding: 2rem 3rem;
                font-size: 2.2rem;
            }

            #stopBtn {
                padding: 3rem 6rem;
                font-size: 2.8rem;
            }

            .header h1 {
                font-size: 3.5rem;
            }

            #status {
                font-size: 1.8rem;
            }

            .connected-door {
                font-size: 2.5rem;
            }

            .scan-message {
                font-size: 1.5rem;
            }
        }
    </style>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <!-- ========================================================= -->
    <!-- SCREEN 1: AUTOMATIC SCANNING / CONNECTION                 -->
    <!-- ========================================================= -->

    <div id="scanScreen">

        <div class="header">

            <h1>SHB Door Control v2.0</h1>

            <div
                class="connected-door"
                id="doorStatusScan"
            >
                Not connected
            </div>

            <div
                class="scan-message"
                id="scanMessage"
            >
                LOOKING FOR AUTHORIZED DOORS...
            </div>

        </div>

        <!-- Backup button.
             This is only needed when a door has never been
             authorized by this browser, or if automatic
             reconnection cannot find it. -->

        <div class="button-group">

            <button
                class="control-btn"
                id="scanBtn"
                onclick="manualScanDoors()"
            >
                SCAN / ADD DOOR
            </button>

        </div>

    </div>


    <!-- ========================================================= -->
    <!-- SCREEN 2: OPERATIONS                                      -->
    <!-- ========================================================= -->

    <div id="controlScreen">

        <div class="header">

            <h1>
                SHB Door Control — OPERATIONS
            </h1>

            <div
                class="connected-door"
                id="doorStatusControl"
            >
                Connected to: —
            </div>

        </div>


        <div class="controls">

            <button
                class="control-btn"
                id="openBtn"
                onclick="sendCommand('O\n')"
            >
                OPEN
            </button>


            <button
                class="control-btn"
                id="halfBtn"
                onclick="sendCommand('H\n')"
            >
                HALF
            </button>


            <button
                class="control-btn"
                id="closeBtn"
                onclick="sendCommand('C\n')"
            >
                CLOSE
            </button>


            <button
                class="control-btn"
                id="stopBtn"
                onclick="sendCommand('S\n')"
            >
                STOP
            </button>

        </div>


        <button
            class="control-btn back-btn"
            onclick="disconnect()"
        >
            CHANGE DOOR / DISCONNECT
        </button>

    </div>


    <!-- ========================================================= -->
    <!-- STATUS                                                     -->
    <!-- ========================================================= -->

    <div id="status"></div>


    <!-- ========================================================= -->
    <!-- PASSCODE MODAL                                             -->
    <!-- ========================================================= -->

    <div
        class="modal"
        id="passcodeModal"
    >

        <div class="modal-content">

            <h2 id="modalTitle">
                Enter Passcode
            </h2>

            <input
                type="password"
                id="passcodeInput"
                maxlength="4"
                inputmode="numeric"
                autocomplete="off"
                placeholder="Enter 4-digit code"
            >

            <div>

                <button onclick="verifyPasscode()">
                    Submit
                </button>

                <button
                    class="cancel"
                    onclick="closePasscodeModal()"
                >
                    Cancel
                </button>

            </div>

        </div>

    </div>


    <!-- ========================================================= -->
    <!-- JAVASCRIPT                                                 -->
    <!-- ========================================================= -->

    <script>

        // =========================================================
        // BLUETOOTH SETTINGS
        // =========================================================

        const UART_SERVICE_UUID =
            '0000ffe0-0000-1000-8000-00805f9b34fb';

        const UART_CHARACTERISTIC_UUID =
            '0000ffe1-0000-1000-8000-00805f9b34fb';


        // =========================================================
        // CONNECTION VARIABLES
        // =========================================================

        let currentDevice = null;

        let currentCharacteristic = null;

        let connectedDoor = null;

        let selectedDevice = null;

        let automaticScanRunning = false;

        let reconnectTimer = null;

        let disconnectingManually = false;


        // =========================================================
        // DOOR PASSCODES
        // =========================================================

        const DOOR_PASSCODES = {

            'D1': null,

            'D2': '1234',

            'D3': '4045',

            'D4': null,

            'D5': '9999'

        };


        const DEFAULT_PASSCODE = null;


        // =========================================================
        // CHECK VALID DOOR NAME
        // =========================================================

        function isValidDoorName(name) {

            return /^D([1-9]|[1-9][0-9])$/.test(
                name || ''
            );

        }


        // =========================================================
        // SHOW SCAN SCREEN
        // =========================================================

        function showScanScreen() {

            document.getElementById(
                'scanScreen'
            ).style.display = 'flex';

            document.getElementById(
                'controlScreen'
            ).style.display = 'none';

            updateUI();

        }


        // =========================================================
        // SHOW CONTROL SCREEN
        // =========================================================

        function showControlScreen() {

            document.getElementById(
                'scanScreen'
            ).style.display = 'none';

            document.getElementById(
                'controlScreen'
            ).style.display = 'flex';

        }


        // =========================================================
        // SET SCAN MESSAGE
        // =========================================================

        function setScanMessage(message) {

            const element =
                document.getElementById('scanMessage');

            if (element) {

                element.textContent = message;

            }

        }


        // =========================================================
        // PASSCODE MODAL
        // =========================================================

        function showPasscodeModal(device) {

            selectedDevice = device;

            const doorName =
                device.name || 'Unknown';

            document.getElementById(
                'modalTitle'
            ).textContent =
                `Enter Passcode for ${doorName}`;

            document.getElementById(
                'passcodeModal'
            ).style.display = 'flex';

            document.getElementById(
                'passcodeInput'
            ).value = '';

            document.getElementById(
                'passcodeInput'
            ).focus();

        }


        function closePasscodeModal() {

            document.getElementById(
                'passcodeModal'
            ).style.display = 'none';

            selectedDevice = null;

            showStatus(
                'Passcode entry cancelled',
                true
            );

            showScanScreen();

        }


        // =========================================================
        // VERIFY PASSCODE
        // =========================================================

        async function verifyPasscode() {

            if (!selectedDevice) {

                return;

            }


            const input =
                document.getElementById(
                    'passcodeInput'
                ).value;

            const doorName =
                selectedDevice.name || 'Unknown';

            const correctPasscode =
                DOOR_PASSCODES[doorName] !== undefined
                    ? DOOR_PASSCODES[doorName]
                    : DEFAULT_PASSCODE;


            if (
                correctPasscode === null ||
                input === correctPasscode
            ) {

                document.getElementById(
                    'passcodeModal'
                ).style.display = 'none';

                const device = selectedDevice;

                selectedDevice = null;

                await connectToDoor(device);

            }
            else {

                showStatus(
                    'Incorrect passcode',
                    true
                );

                document.getElementById(
                    'passcodeInput'
                ).value = '';

                document.getElementById(
                    'passcodeInput'
                ).focus();

            }

        }


        // =========================================================
        // ENTER / ESCAPE FOR PASSCODE
        // =========================================================

        document
            .getElementById('passcodeInput')
            .addEventListener(
                'keydown',
                function(event) {

                    if (event.key === 'Enter') {

                        event.preventDefault();

                        verifyPasscode();

                    }

                    if (event.key === 'Escape') {

                        event.preventDefault();

                        closePasscodeModal();

                    }

                }
            );


        // =========================================================
        // AUTOMATICALLY FIND PREVIOUSLY AUTHORIZED DOORS
        // =========================================================
        //
        // This is the important new function.
        //
        // navigator.bluetooth.getDevices() returns Bluetooth
        // devices that this website has previously been granted
        // permission to use.
        //
        // This does NOT open the Bluetooth picker.
        //
        // It allows the page to automatically try to reconnect
        // to doors that were previously authorized.
        //
        // =========================================================

        async function autoReconnectToAuthorizedDoor() {

            if (automaticScanRunning) {

                return;

            }


            automaticScanRunning = true;

            showScanScreen();

            setScanMessage(
                'LOOKING FOR AUTHORIZED DOORS...'
            );

            showStatus(
                'Checking for previously authorized doors...'
            );


            try {

                // =================================================
                // WEB BLUETOOTH SUPPORT CHECK
                // =================================================

                if (!navigator.bluetooth) {

                    throw new Error(
                        'Web Bluetooth is not supported by this browser.'
                    );

                }


                // =================================================
                // GET PREVIOUSLY AUTHORIZED DEVICES
                // =================================================

                const devices =
                    await navigator.bluetooth.getDevices();


                console.log(
                    'Previously authorized Bluetooth devices:',
                    devices
                );


                // =================================================
                // KEEP ONLY D1-D99
                // =================================================

                const doors =
                    devices.filter(
                        device =>
                            isValidDoorName(device.name)
                    );


                // =================================================
                // NO AUTHORIZED DOORS
                // =================================================

                if (doors.length === 0) {

                    setScanMessage(
                        'NO AUTHORIZED DOORS FOUND — USE SCAN / ADD DOOR ONCE'
                    );

                    showStatus(
                        'No previously authorized doors found.'
                    );

                    automaticScanRunning = false;

                    return;

                }


                // =================================================
                // TRY EACH AUTHORIZED DOOR
                // =================================================
                //
                // We try the doors one at a time.
                //
                // If a door is powered off or out of range,
                // the next authorized door will be tried.
                //
                // =================================================

                for (const device of doors) {

                    if (connectedDoor) {

                        break;

                    }


                    try {

                        setScanMessage(
                            `LOOKING FOR ${device.name}...`
                        );

                        showStatus(
                            `Trying to reconnect to ${device.name}...`
                        );


                        await connectToDoor(
                            device,
                            true
                        );


                        // If connection succeeded,
                        // connectToDoor sets connectedDoor.

                        if (connectedDoor) {

                            break;

                        }

                    }
                    catch (err) {

                        console.warn(
                            `Could not connect to ${device.name}:`,
                            err
                        );

                    }

                }


                // =================================================
                // NOTHING CONNECTED
                // =================================================

                if (!connectedDoor) {

                    setScanMessage(
                        'AUTHORIZED DOORS NOT AVAILABLE'
                    );

                    showStatus(
                        'No authorized doors are currently available.',
                        true
                    );

                }

            }
            catch (err) {

                console.error(
                    'Automatic Bluetooth scan failed:',
                    err
                );


                setScanMessage(
                    'AUTOMATIC SCAN NOT AVAILABLE'
                );

                showStatus(
                    err.message ||
                    'Automatic Bluetooth scan failed.',
                    true
                );

            }


            automaticScanRunning = false;

        }


        // =========================================================
        // MANUAL SCAN / ADD NEW DOOR
        // =========================================================
        //
        // This function still requires the user to press the
        // button because browsers require a user gesture before
        // showing the Bluetooth device picker.
        //
        // Once the door is authorized, future page loads can
        // automatically find it with getDevices().
        //
        // =========================================================

        async function manualScanDoors() {

            if (!navigator.bluetooth) {

                showStatus(
                    'Web Bluetooth is not supported by this browser.',
                    true
                );

                return;

            }


            try {

                setScanMessage(
                    'SELECT A DOOR FROM THE BLUETOOTH LIST'
                );

                showStatus(
                    'Opening Bluetooth door list...'
                );


                const device =
                    await navigator.bluetooth.requestDevice({

                        filters: [
                            {
                                namePrefix: 'D'
                            }
                        ],

                        optionalServices: [
                            UART_SERVICE_UUID
                        ]

                    });


                // =================================================
                // VERIFY DOOR NAME
                // =================================================

                if (!isValidDoorName(device.name)) {

                    showStatus(
                        'Only D1-D99 doors are supported.',
                        true
                    );

                    setScanMessage(
                        'READY — USE SCAN / ADD DOOR'
                    );

                    return;

                }


                // =================================================
                // PASSCODE CHECK
                // =================================================

                const passcode =
                    DOOR_PASSCODES[device.name] !== undefined
                        ? DOOR_PASSCODES[device.name]
                        : DEFAULT_PASSCODE;


                if (passcode === null) {

                    await connectToDoor(
                        device,
                        false
                    );

                }
                else {

                    showPasscodeModal(
                        device
                    );

                }

            }
            catch (err) {

                console.error(
                    'Manual Bluetooth scan error:',
                    err
                );


                if (
                    err.name === 'NotFoundError'
                ) {

                    showStatus(
                        'No Bluetooth door was selected.',
                        true
                    );

                }
                else if (
                    err.name === 'NotAllowedError'
                ) {

                    showStatus(
                        'Bluetooth access was cancelled or blocked.',
                        true
                    );

                }
                else {

                    showStatus(
                        `Error: ${err.message}`,
                        true
                    );

                }


                setScanMessage(
                    'READY — USE SCAN / ADD DOOR'
                );

            }

        }


        // =========================================================
        // CONNECT TO DOOR
        // =========================================================
        //
        // automaticConnection = true means this was attempted
        // automatically from getDevices().
        //
        // automaticConnection = false means the user selected
        // the door from the Bluetooth picker.
        //
        // =========================================================

        async function connectToDoor(
            device,
            automaticConnection = false
        ) {

            try {

                if (!device) {

                    throw new Error(
                        'No Bluetooth device was supplied.'
                    );

                }


                showStatus(
                    `Connecting to ${device.name}...`
                );


                setScanMessage(
                    `CONNECTING TO ${device.name}...`
                );


                // =================================================
                // DISCONNECT OLD DEVICE
                // =================================================

                if (
                    currentDevice &&
                    currentDevice !== device &&
                    currentDevice.gatt &&
                    currentDevice.gatt.connected
                ) {

                    try {

                        await currentDevice.gatt.disconnect();

                    }
                    catch (disconnectError) {

                        console.warn(
                            'Previous device disconnect error:',
                            disconnectError
                        );

                    }

                }


                // =================================================
                // CLEAR OLD CONNECTION
                // =================================================

                currentCharacteristic = null;

                connectedDoor = null;


                // =================================================
                // SAVE DEVICE
                // =================================================

                currentDevice = device;


                // =================================================
                // CONNECT TO GATT
                // =================================================

                if (
                    !currentDevice.gatt
                ) {

                    throw new Error(
                        'Bluetooth GATT is not available for this device.'
                    );

                }


                const server =
                    await currentDevice.gatt.connect();


                // =================================================
                // GET UART SERVICE
                // =================================================

                const service =
                    await server.getPrimaryService(
                        UART_SERVICE_UUID
                    );


                // =================================================
                // GET UART CHARACTERISTIC
                // =================================================

                currentCharacteristic =
                    await service.getCharacteristic(
                        UART_CHARACTERISTIC_UUID
                    );


                // =================================================
                // SAVE CONNECTED DOOR
                // =================================================

                connectedDoor =
                    device.name;


                updateUI();


                showStatus(
                    `Connected to ${connectedDoor}`
                );


                setScanMessage(
                    `CONNECTED TO ${connectedDoor}`
                );


                // =================================================
                // SHOW OPERATIONS
                // =================================================

                showControlScreen();


                // =================================================
                // INSTALL DISCONNECT HANDLER
                // =================================================

                currentDevice.addEventListener(
                    'gattserverdisconnected',
                    handleDisconnected
                );


                return true;

            }
            catch (err) {

                console.error(
                    `Connection failed for ${device?.name}:`,
                    err
                );


                currentCharacteristic = null;

                connectedDoor = null;


                if (
                    automaticConnection
                ) {

                    /*
                     * Automatic reconnect attempts are allowed
                     * to fail quietly so the next authorized
                     * door can be tried.
                     */

                    showScanScreen();

                    return false;

                }


                showStatus(
                    `Connection failed: ${err.message}`,
                    true
                );

                setScanMessage(
                    'CONNECTION FAILED — READY TO SCAN'
                );

                showScanScreen();

                return false;

            }

        }


        // =========================================================
        // HANDLE BLUETOOTH DISCONNECT
        // =========================================================

        function handleDisconnected() {

            if (disconnectingManually) {

                return;

            }


            connectedDoor = null;

            currentCharacteristic = null;

            updateUI();


            showStatus(
                'Door disconnected.',
                true
            );


            setScanMessage(
                'DOOR DISCONNECTED — LOOKING FOR DOORS...'
            );


            showScanScreen();


            /*
             * Try to reconnect automatically after a short delay.
             *
             * This is useful if a door temporarily loses power
             * or Bluetooth connection.
             */

            scheduleAutomaticReconnect();

        }


        // =========================================================
        // AUTOMATIC RECONNECT TIMER
        // =========================================================

        function scheduleAutomaticReconnect() {

            if (reconnectTimer) {

                clearTimeout(
                    reconnectTimer
                );

            }


            reconnectTimer =
                setTimeout(
                    function() {

                        if (!connectedDoor) {

                            autoReconnectToAuthorizedDoor();

                        }

                    },
                    2000
                );

        }


        // =========================================================
        // DISCONNECT / CHANGE DOOR
        // =========================================================

        async function disconnect() {

            disconnectingManually = true;


            if (reconnectTimer) {

                clearTimeout(
                    reconnectTimer
                );

                reconnectTimer = null;

            }


            try {

                if (
                    currentDevice &&
                    currentDevice.gatt &&
                    currentDevice.gatt.connected
                ) {

                    await currentDevice.gatt.disconnect();

                }

            }
            catch (err) {

                console.warn(
                    'Disconnect error:',
                    err
                );

            }


            currentCharacteristic = null;

            currentDevice = null;

            connectedDoor = null;

            selectedDevice = null;


            document.getElementById(
                'passcodeModal'
            ).style.display = 'none';


            updateUI();


            showStatus(
                'Disconnected. Ready to select another door.'
            );


            setScanMessage(
                'READY — USE SCAN / ADD DOOR'
            );


            showScanScreen();


            /*
             * Do NOT automatically reconnect here.
             *
             * The operator specifically selected
             * CHANGE DOOR / DISCONNECT.
             */

            setTimeout(
                function() {

                    disconnectingManually = false;

                },
                500
            );

        }


        // =========================================================
        // SEND DOOR COMMAND
        // =========================================================

        async function sendCommand(command) {

            if (!currentCharacteristic) {

                showStatus(
                    'Not connected to any door.',
                    true
                );

                return;

            }


            try {

                const data =
                    new TextEncoder().encode(
                        command
                    );


                await currentCharacteristic.writeValue(
                    data
                );


                showStatus(
                    `Sent: ${command.trim()} command`
                );

            }
            catch (err) {

                console.error(
                    'Command failed:',
                    err
                );


                showStatus(
                    `Send failed: ${err.message}`,
                    true
                );

            }

        }


        // =========================================================
        // UPDATE UI
        // =========================================================

        function updateUI() {

            const statusText =
                connectedDoor
                    ? `Connected to: ${connectedDoor}`
                    : 'Not connected';


            document.getElementById(
                'doorStatusScan'
            ).textContent =
                statusText;


            document.getElementById(
                'doorStatusControl'
            ).textContent =
                statusText;

        }


        // =========================================================
        // STATUS MESSAGE
        // =========================================================

        function showStatus(
            message,
            isError = false
        ) {

            const statusDiv =
                document.getElementById(
                    'status'
                );


            statusDiv.textContent =
                message;


            statusDiv.style.color =
                isError
                    ? '#ef4444'
                    : '#22c55e';

        }


        // =========================================================
        // PAGE STARTUP
        // =========================================================
        //
        // EVERY TIME THE PAGE OPENS:
        //
        // 1. Reset the user interface.
        // 2. Show the scanning screen.
        // 3. Ask the browser for previously authorized doors.
        // 4. Try to reconnect automatically.
        //
        // There is NO Bluetooth picker at startup.
        //
        // =========================================================

        window.addEventListener(
            'load',
            function() {

                // Reset variables.

                currentDevice = null;

                currentCharacteristic = null;

                connectedDoor = null;

                selectedDevice = null;

                automaticScanRunning = false;

                disconnectingManually = false;


                if (reconnectTimer) {

                    clearTimeout(
                        reconnectTimer
                    );

                    reconnectTimer = null;

                }


                // Close passcode window.

                document.getElementById(
                    'passcodeModal'
                ).style.display = 'none';


                // Always start on scan screen.

                showScanScreen();


                // Reset message.

                setScanMessage(
                    'LOOKING FOR AUTHORIZED DOORS...'
                );


                showStatus(
                    'Starting automatic door search...'
                );


                updateUI();


                // =================================================
                // START AUTOMATIC SEARCH
                // =================================================

                /*
                 * Give the page a moment to finish loading before
                 * asking Web Bluetooth for authorized devices.
                 */

                setTimeout(
                    function() {

                        autoReconnectToAuthorizedDoor();

                    },
                    300
                );

            }
        );


    </script>

</body>
</html>
